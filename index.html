<!doctype html>
<html lang="en" class="dark" style="background-color: #070e17; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070e17" />
    <title>Putta Vaishnavi - Software Engineer Portfolio</title>
    <meta name="description" content="Portfolio of Putta Vaishnavi, Full-Stack Software Engineer & AI Systems Developer based in Paris, France (EPITA Bac+5). Projects in AI, Spring Boot, React, and enterprise systems." />
    <meta property="og:title" content="Putta Vaishnavi - Software Engineer Portfolio" />
    <meta property="og:description" content="Portfolio of Putta Vaishnavi, Full-Stack Software Engineer & AI Systems Developer based in Paris, France (EPITA Bac+5). Projects in AI, Spring Boot, React, and enterprise systems." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Prevent White Flash (FOUC) on load / refresh -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#070e17';
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#070e17';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased bg-[#070e17] text-slate-100 selection:bg-cyan-500 selection:text-slate-950" style="background-color: #070e17; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
